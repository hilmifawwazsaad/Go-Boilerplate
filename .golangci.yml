run:
  timeout: 5m

linters:
  enable:
    - errcheck       # pastikan semua error dicek
    - govet          # deteksi kesalahan umum
    - staticcheck    # static analysis
    - gosimple       # sederhanakan kode yang tidak perlu
    - unused         # deteksi variabel/fungsi yang tidak dipakai
    - goimports      # import harus rapi dan terurut

linters-settings:
  goimports:
    local-prefixes: go-boilerplate
