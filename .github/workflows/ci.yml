name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-build:
    name: Format, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -s -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "File berikut belum diformat:"
            echo "$UNFORMATTED"
            echo "Jalankan: gofmt -s -w ."
            exit 1
          fi

      - name: Run vet
        run: go vet ./...

      - name: Run lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.12.2

      - name: Build
        run: go build ./...

      - name: Run tests
        run: go test ./...
