pre-commit:
  commands:
    fmt:
      glob: "*.go"
      run: gofmt -w .
    vet:
      glob: "*.go"
      run: go vet ./...
    lint:
      glob: "*.go"
      run: golangci-lint run

post-merge:
  commands:
    tidy:
      run: go mod tidy

pre-push:
  commands:
    lint-strict:
      glob: "*.go"
      run: golangci-lint run --max-issues-per-linter 0 --max-same-issues 0
